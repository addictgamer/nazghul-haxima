[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-haxima"
version = "0.1.0"
description = "Pygame redesign of the Nazghul/Haxima RPG engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pygame_haxima*"]

[tool.ruff]
line-length = 100
